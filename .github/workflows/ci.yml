name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    release-verify:
        name: "Release Verify"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "read"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install declared npm version"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global --ignore-scripts "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
                  python -m pip install --user --disable-pip-version-check yamllint==1.38.0
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Run release verification"
              run: "npm run release:check"

    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install declared npm version"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global --ignore-scripts "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Upload bundle analysis to Codecov"
              if: "${{ matrix.os == 'ubuntu-latest' && !cancelled() && env.CODECOV_TOKEN != '' }}"
              continue-on-error: true
              run: |
                  npm install --global --ignore-scripts @codecov/bundle-analyzer@2.0.1
                  bundle-analyzer ./dist --bundle-name=eslint-plugin-chunkyLint --upload-token="${CODECOV_TOKEN}"
              env:
                  GITHUB_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
                  GITHUB_REF: "${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run test:ci"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-chunkyLint"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-chunkyLint"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install declared npm version"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global --ignore-scripts "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Pack package for the ESLint 9 consumer"
              id: "pack"
              run: |
                  set -euo pipefail
                  mkdir -p temp
                  npm pack --json --pack-destination temp > temp/npm-pack.json
                  # shellcheck disable=SC2016
                  tarball_path=$(node -e '
                    const fs = require("node:fs");
                    const metadata = JSON.parse(fs.readFileSync("temp/npm-pack.json", "utf8"));
                    const records = Array.isArray(metadata) ? metadata : Object.values(metadata);
                    if (records.length !== 1 || typeof records[0]?.filename !== "string" || records[0].filename.trim() === "") {
                      throw new Error("Expected exactly one npm pack record with a nonblank filename.");
                    }
                    process.stdout.write(`temp/${records[0].filename}`);
                  ')
                  echo "tarball_path=${tarball_path}" >> "${GITHUB_OUTPUT}"

            - name: "Install isolated ESLint 9 consumer"
              env:
                  CONSUMER_DIR: "${{ runner.temp }}/eslint9-${{ matrix.label }}"
                  ESLINT_JS_VERSION: "${{ matrix.eslint-js-version }}"
                  ESLINT_VERSION: "${{ matrix.eslint-version }}"
                  TARBALL_PATH: "${{ steps.pack.outputs.tarball_path }}"
              run: |
                  set -euo pipefail
                  mkdir -p "${CONSUMER_DIR}"
                  npm init --yes --prefix "${CONSUMER_DIR}" >/dev/null
                  printf 'export const smoke = true;\n' > "${CONSUMER_DIR}/smoke.js"
                  npm install --prefix "${CONSUMER_DIR}" --ignore-scripts --no-audit --no-fund \
                    "${GITHUB_WORKSPACE}/${TARBALL_PATH}" \
                    "eslint@${ESLINT_VERSION}" \
                    "@eslint/js@${ESLINT_JS_VERSION}"

            - name: "Run ESLint 9 compatibility smoke checks"
              env:
                  CONSUMER_DIR: "${{ runner.temp }}/eslint9-${{ matrix.label }}"
              run: |
                  node scripts/eslint9-compat-smoke.mjs "--consumer-root=${CONSUMER_DIR}" --expect-eslint-major=9
